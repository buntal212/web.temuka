name: temuka-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TEMUKA_UID: ${TEMUKA_UID:-1000}
        TEMUKA_GID: ${TEMUKA_GID:-1000}
    working_dir: /app
    user: "1000:1000"
    volumes:
      - .:/app
    ports:
      - "${TEMUKA_WEB_PORT:-9000}:9000"
    environment:
      NODE_ENV: development
      PORT: "9000"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8020}
    command: ["./docker/entrypoint.sh", "npx", "quasar", "dev", "-m", "ssr", "-H", "0.0.0.0", "-p", "9000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      default:
      temuka-uih-network:
        aliases:
          - temuka-web-app

networks:
  default:
  temuka-uih-network:
    name: temuka-uih-network
    external: true
